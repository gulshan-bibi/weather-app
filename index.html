<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App - Ghulshan Bibi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>🌤️ Weather App</h1>
<div class="search-box">
<input type="text" id="cityInput" placeholder="Enter city name (e.g., Lahore)">
<button id="searchBtn">Search</button>
</div>
<div id="weatherCard" class="card hidden">
<img id="weatherIcon" src="" alt="">
<h2 id="cityName"></h2>
<h3 id="temp"></h3>
<p id="condition"></p>
<div class="details">
<p>💧 Humidity: <span id="humidity"></span></p>
<p>💨 Wind: <span id="wind"></span></p>
<p>🌡️ Feels Like: <span id="feelsLike"></span></p>
</div>
</div>
<p id="error" class="error"></p>
<p class="footer">Made by Ghulshan Bibi | ID: 198 | Task 11</p>
</div>
<script src="script.js"></script>
</body>
</html>
